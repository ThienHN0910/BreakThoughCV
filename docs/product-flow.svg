<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #132238; }
      .subtitle { font: 13px Arial, sans-serif; fill: #5d728a; }
      .section-title { font: 700 19px Arial, sans-serif; fill: #132238; }
      .box-title { font: 700 14px Arial, sans-serif; fill: #132238; }
      .text { font: 13px Arial, sans-serif; fill: #34465d; }
      .small { font: 12px Arial, sans-serif; fill: #5d728a; }
      .start { fill: #132238; stroke: #132238; stroke-width: 2; rx: 24; }
      .start-text { font: 700 14px Arial, sans-serif; fill: #ffffff; }
      .auth { fill: #eef6ff; stroke: #0b5fff; stroke-width: 2; rx: 14; }
      .candidate-section { fill: #f2fff8; stroke: #18a058; stroke-width: 2; rx: 20; }
      .recruiter-section { fill: #fff8ec; stroke: #f0a429; stroke-width: 2; rx: 20; }
      .candidate-box { fill: #ffffff; stroke: #18a058; stroke-width: 1.6; rx: 12; }
      .recruiter-box { fill: #ffffff; stroke: #f0a429; stroke-width: 1.6; rx: 12; }
      .decision { fill: #ffffff; stroke: #7b61ff; stroke-width: 2; }
      .arrow { stroke: #46627f; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .cross { stroke: #7b91aa; stroke-width: 2; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#46627f"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7b91aa"/>
    </marker>
  </defs>

  <rect width="1500" height="1050" fill="#ffffff"/>
  <text x="55" y="58" class="title">BreakThroughCV - Product Flow</text>
  <text x="55" y="86" class="subtitle">End-to-end user journey for Candidate and Recruiter roles</text>

  <!-- Auth flow -->
  <rect x="90" y="135" width="130" height="52" class="start"/>
  <text x="155" y="166" text-anchor="middle" class="start-text">START</text>

  <rect x="285" y="126" width="200" height="70" class="auth"/>
  <text x="385" y="154" text-anchor="middle" class="box-title">Google Login</text>
  <text x="385" y="177" text-anchor="middle" class="text">Authenticate account</text>

  <polygon points="585,160 670,105 755,160 670,215" class="decision"/>
  <text x="670" y="154" text-anchor="middle" class="box-title">Has role?</text>
  <text x="670" y="176" text-anchor="middle" class="small">candidate/recruiter</text>

  <rect x="810" y="126" width="190" height="70" class="auth"/>
  <text x="905" y="154" text-anchor="middle" class="box-title">Select Role</text>
  <text x="905" y="177" text-anchor="middle" class="text">First-time user</text>

  <polygon points="1110,160 1200,105 1290,160 1200,215" class="decision"/>
  <text x="1200" y="154" text-anchor="middle" class="box-title">Role</text>
  <text x="1200" y="176" text-anchor="middle" class="small">choose flow</text>

  <path d="M220 161 L285 161" class="arrow"/>
  <path d="M485 161 L585 161" class="arrow"/>
  <path d="M755 161 L810 161" class="arrow"/>
  <path d="M1000 161 L1110 161" class="arrow"/>
  <path d="M670 215 C670 245 1160 245 1200 215" class="arrow"/>
  <text x="783" y="145" class="small">No role</text>
  <text x="760" y="237" class="small">Has role</text>

  <!-- Candidate flow -->
  <rect x="55" y="310" width="645" height="610" class="candidate-section"/>
  <text x="377" y="346" text-anchor="middle" class="section-title">Candidate Flow</text>

  <rect x="100" y="385" width="210" height="64" class="candidate-box"/>
  <text x="205" y="412" text-anchor="middle" class="box-title">Dashboard</text>
  <text x="205" y="434" text-anchor="middle" class="text">Candidate home</text>

  <rect x="405" y="385" width="210" height="64" class="candidate-box"/>
  <text x="510" y="412" text-anchor="middle" class="box-title">Upload / Manage CV</text>
  <text x="510" y="434" text-anchor="middle" class="text">PDF stored securely</text>

  <rect x="100" y="490" width="210" height="64" class="candidate-box"/>
  <text x="205" y="517" text-anchor="middle" class="box-title">Browse Jobs</text>
  <text x="205" y="539" text-anchor="middle" class="text">Search/filter jobs</text>

  <rect x="405" y="490" width="210" height="64" class="candidate-box"/>
  <text x="510" y="517" text-anchor="middle" class="box-title">Wanted Jobs</text>
  <text x="510" y="539" text-anchor="middle" class="text">Save jobs to review</text>

  <rect x="100" y="595" width="210" height="64" class="candidate-box"/>
  <text x="205" y="622" text-anchor="middle" class="box-title">AI Review CV</text>
  <text x="205" y="644" text-anchor="middle" class="text">Compare CV with JD</text>

  <polygon points="510,592 610,627 510,662 410,627" class="decision"/>
  <text x="510" y="622" text-anchor="middle" class="box-title">Reviewed?</text>
  <text x="510" y="644" text-anchor="middle" class="small">required</text>

  <rect x="100" y="710" width="210" height="64" class="candidate-box"/>
  <text x="205" y="737" text-anchor="middle" class="box-title">Apply Job</text>
  <text x="205" y="759" text-anchor="middle" class="text">Quick apply with CV</text>

  <rect x="405" y="710" width="210" height="64" class="candidate-box"/>
  <text x="510" y="737" text-anchor="middle" class="box-title">Track Applications</text>
  <text x="510" y="759" text-anchor="middle" class="text">Pending / Accepted / Rejected</text>

  <rect x="250" y="815" width="210" height="64" class="candidate-box"/>
  <text x="355" y="842" text-anchor="middle" class="box-title">Cancel Apply</text>
  <text x="355" y="864" text-anchor="middle" class="text">Remove own application</text>

  <path d="M205 449 L205 490" class="arrow"/>
  <path d="M310 417 L405 417" class="arrow"/>
  <path d="M310 522 L405 522" class="arrow"/>
  <path d="M405 522 C350 522 320 627 310 627" class="arrow"/>
  <path d="M310 627 L410 627" class="arrow"/>
  <path d="M410 627 C350 660 255 680 205 710" class="arrow"/>
  <path d="M310 742 L405 742" class="arrow"/>
  <path d="M510 774 C510 820 460 847 460 847" class="arrow"/>
  <path d="M510 592 C510 560 255 560 205 595" class="arrow"/>
  <text x="330" y="686" class="small">Yes</text>
  <text x="363" y="583" class="small">No, review first</text>

  <!-- Recruiter flow -->
  <rect x="800" y="310" width="645" height="610" class="recruiter-section"/>
  <text x="1122" y="346" text-anchor="middle" class="section-title">Recruiter Flow</text>

  <rect x="845" y="385" width="210" height="64" class="recruiter-box"/>
  <text x="950" y="412" text-anchor="middle" class="box-title">Dashboard</text>
  <text x="950" y="434" text-anchor="middle" class="text">Recruiter home</text>

  <rect x="1150" y="385" width="210" height="64" class="recruiter-box"/>
  <text x="1255" y="412" text-anchor="middle" class="box-title">Company Profile</text>
  <text x="1255" y="434" text-anchor="middle" class="text">Logo, info, category</text>

  <rect x="845" y="490" width="210" height="64" class="recruiter-box"/>
  <text x="950" y="517" text-anchor="middle" class="box-title">Create / Edit Job</text>
  <text x="950" y="539" text-anchor="middle" class="text">Title, JD, skills</text>

  <rect x="1150" y="490" width="210" height="64" class="recruiter-box"/>
  <text x="1255" y="517" text-anchor="middle" class="box-title">Job Details</text>
  <text x="1255" y="539" text-anchor="middle" class="text">Manual JD and skills</text>

  <rect x="845" y="595" width="210" height="64" class="recruiter-box"/>
  <text x="950" y="622" text-anchor="middle" class="box-title">Publish Job</text>
  <text x="950" y="644" text-anchor="middle" class="text">Visible to candidates</text>

  <rect x="1150" y="595" width="210" height="64" class="recruiter-box"/>
  <text x="1255" y="622" text-anchor="middle" class="box-title">View Applications</text>
  <text x="1255" y="644" text-anchor="middle" class="text">Per job applicant list</text>

  <rect x="845" y="710" width="210" height="64" class="recruiter-box"/>
  <text x="950" y="737" text-anchor="middle" class="box-title">View Candidate CV</text>
  <text x="950" y="759" text-anchor="middle" class="text">Inline PDF preview</text>

  <rect x="1150" y="710" width="210" height="64" class="recruiter-box"/>
  <text x="1255" y="737" text-anchor="middle" class="box-title">Manual Evaluation</text>
  <text x="1255" y="759" text-anchor="middle" class="text">Assess candidate fit</text>

  <polygon points="950,810 1050,847 950,884 850,847" class="decision"/>
  <text x="950" y="842" text-anchor="middle" class="box-title">Decision</text>
  <text x="950" y="864" text-anchor="middle" class="small">fit?</text>

  <rect x="1150" y="815" width="100" height="58" class="recruiter-box"/>
  <text x="1200" y="839" text-anchor="middle" class="box-title">Accept</text>
  <text x="1200" y="859" text-anchor="middle" class="small">Accepted</text>

  <rect x="1260" y="815" width="100" height="58" class="recruiter-box"/>
  <text x="1310" y="839" text-anchor="middle" class="box-title">Reject</text>
  <text x="1310" y="859" text-anchor="middle" class="small">Rejected</text>

  <path d="M950 449 L950 490" class="arrow"/>
  <path d="M1055 417 L1150 417" class="arrow"/>
  <path d="M1055 522 L1150 522" class="arrow"/>
  <path d="M1150 522 C1090 550 1010 575 950 595" class="arrow"/>
  <path d="M1055 627 L1150 627" class="arrow"/>
  <path d="M1255 659 C1255 690 1010 690 950 710" class="arrow"/>
  <path d="M1055 742 L1150 742" class="arrow"/>
  <path d="M1255 774 C1255 820 1080 847 1050 847" class="arrow"/>
  <path d="M1050 847 L1150 844" class="arrow"/>
  <path d="M1050 847 C1120 900 1235 890 1260 855" class="arrow"/>

  <!-- Role links -->
  <path d="M1160 205 C980 260 640 285 377 310" class="arrow"/>
  <path d="M1240 205 C1260 260 1200 285 1122 310" class="arrow"/>
  <text x="815" y="276" class="small">candidate</text>
  <text x="1266" y="276" class="small">recruiter</text>

  <!-- Cross role feedback -->
  <path d="M310 742 C640 730 880 610 1150 627" class="cross"/>
  <text x="650" y="714" class="small">Application created</text>
  <path d="M1200 873 C1030 990 660 965 510 774" class="cross"/>
  <text x="850" y="958" class="small">Status visible to candidate</text>

  <text x="55" y="1005" class="subtitle">Product flow source: BreakThroughCV candidate/recruiter screens. AI is used only in the Candidate flow.</text>
</svg>
